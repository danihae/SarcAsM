name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Runs the data-free part of the suite. The tif fixtures live in Git LFS and are
# not pulled here; conftest recognises the pointer files and skips those tests.
# The GUI model tests run against an offscreen Qt platform.
jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - uses: astral-sh/setup-uv@v3

      - name: Install (CPU torch)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest

      - name: Run tests
        run: |
          .venv/bin/python -m pytest -p no:cacheprovider -o addopts="" -ra \
            --ignore=tests/test_structure.py \
            --ignore=tests/test_benchmark.py
