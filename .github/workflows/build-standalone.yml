name: Build Standalone Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[app,dev]"
      
      - name: Build standalone app
        run: |
          source .venv/bin/activate && pyinstaller sarcasm.spec
      
      - name: Prepare DMG contents
        run: |
          mkdir -p dmg_contents
          cp -r dist/SarcAsM-*.app dmg_contents/
          cp docs/INSTALL.txt dmg_contents/"📖 READ ME FIRST.txt"
          ln -s /Applications dmg_contents/Applications
      
      - name: Create DMG
        run: |
          hdiutil create -volname "SarcAsM-${{ github.ref_name }}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            dist/SarcAsM-${{ github.ref_name }}-macos.dmg
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SarcAsM-*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        shell: pwsh
        run: |
          uv venv
          uv pip install -e ".[app,dev]"
      
      - name: Build standalone app
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pyinstaller --noconfirm sarcasm.spec
      
      - name: Create ZIP from folder
        shell: pwsh
        run: |
          # ONEDIR creates a folder, not a single .exe
          $folder = Get-ChildItem "dist" -Filter "SarcAsM-v*" -Directory | Select-Object -First 1
          if ($folder) {
            Compress-Archive -Path $folder.FullName -DestinationPath "dist\SarcAsM-${{ github.ref_name }}-windows.zip"
            Write-Host "Created ZIP from folder: $($folder.Name)"
          } else {
            Write-Error "No SarcAsM folder found in dist/"
            exit 1
          }
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SarcAsM-*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}
