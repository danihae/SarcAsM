name: Build Standalone Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[app,dev]"
      
      - name: Build standalone app
        run: |
          source .venv/bin/activate && pyinstaller sarcasm.spec
      
      - name: Prepare DMG contents
        run: |
          mkdir -p dmg_contents
          cp -r dist/SarcAsM-*.app dmg_contents/
          cp docs/INSTALL.txt dmg_contents/"📖 READ ME FIRST.txt"
          ln -s /Applications dmg_contents/Applications
      
      - name: Create DMG
        run: |
          hdiutil create -volname "SarcAsM-${{ github.ref_name }}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            dist/SarcAsM-${{ github.ref_name }}-macos.dmg
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SarcAsM-*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create virtual environment
        run: python -m venv .venv
      
      - name: Install dependencies with standard pip
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          # Install project dependencies EXCEPT numpy
          pip install -e ".[app,dev]" --no-deps
          pip install pyinstaller torch bio-image-unet matplotlib matplotlib-scalebar PyQt5 pandas trackpy scikit-learn scikit-image PyWavelets igraph numba qtutils networkx openpyxl tifffile orjson napari
          # Now install numpy explicitly from wheel ONLY
          pip install --only-binary :all: --force-reinstall numpy==2.2.6
      
      - name: Verify NumPy has .libs
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          python -c "import os, numpy, glob; libs_dir = os.path.join(os.path.dirname(numpy.__file__), '.libs'); exists = os.path.exists(libs_dir); dll_count = len(glob.glob(os.path.join(libs_dir, '*.dll'))) if exists else 0; print(f'NumPy: {numpy.__version__}'); print(f'.libs exists: {exists}'); print(f'DLLs: {dll_count}'); exit(0 if dll_count > 5 else 1)"
      
      - name: Build standalone app
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pyinstaller --noconfirm sarcasm.spec
      
      - name: Verify build contains numpy.libs
        shell: pwsh
        run: |
          if (Test-Path "dist\SarcAsM-*\_internal\numpy.libs") {
            Write-Host "SUCCESS: numpy.libs in build"
            Get-ChildItem "dist\SarcAsM-*\_internal\numpy.libs\*.dll"
          } else {
            Write-Error "FAILED: numpy.libs missing"
            exit 1
          }
      
      - name: Create ZIP
        run: Compress-Archive -Path dist\SarcAsM-*.exe -DestinationPath dist\SarcAsM-${{ github.ref_name }}-windows.zip
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SarcAsM-*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}
