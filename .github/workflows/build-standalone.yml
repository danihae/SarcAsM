name: Build Standalone Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[app,dev]"
      
      - name: Build standalone app
        run: |
          source .venv/bin/activate && pyinstaller sarcasm.spec
      
      - name: Prepare DMG contents
        run: |
          mkdir -p dmg_contents
          cp -r dist/SarcAsM-*.app dmg_contents/
          cp docs/INSTALL.txt dmg_contents/"📖 READ ME FIRST.txt"
          ln -s /Applications dmg_contents/Applications
      
      - name: Create DMG
        run: |
          hdiutil create -volname "SarcAsM-${{ github.ref_name }}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            dist/SarcAsM-${{ github.ref_name }}-macos.dmg
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SarcAsM-*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        shell: pwsh
        run: |
          uv venv
          uv pip install -e ".[app,dev]"
      
      - name: Build standalone app
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          pyinstaller --noconfirm sarcasm.spec

      - name: DEBUG - Show what hook actually collected
        shell: pwsh
        run: |
          Write-Host "=== Build warnings (hook output) ==="
          if (Test-Path "build\sarcasm\warn-sarcasm.txt") {
            Get-Content "build\sarcasm\warn-sarcasm.txt" | Select-String "hook-numpy"
          }
          Write-Host "`n=== What's actually in dist folder ==="
          Get-ChildItem "dist\SarcAsM-*\_internal" -Recurse -Filter "*.libs" -Directory | ForEach-Object {
            Write-Host "Found folder: $($_.FullName)"
            Get-ChildItem $_.FullName -Filter "*.dll" | Select-Object Name, Length
          }
          Write-Host "`n=== Searching for any DLL with 'blas' in name ==="
          Get-ChildItem "dist\SarcAsM-*\_internal" -Recurse -Filter "*blas*.dll" | Select-Object FullName

      - name: Verify build contains DLLs
        shell: pwsh
        run: |
          if (Test-Path "dist\SarcAsM-*\_internal\numpy.libs") {
            $dllCount = (Get-ChildItem "dist\SarcAsM-*\_internal\numpy.libs\*.dll").Count
            Write-Host "SUCCESS: Found $dllCount DLLs in build"
          } else {
            Write-Error "FAILED: numpy.libs missing from build"
            exit 1
          }
      
      - name: Create ZIP
        run: Compress-Archive -Path dist\SarcAsM-*.exe -DestinationPath dist\SarcAsM-${{ github.ref_name }}-windows.zip
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SarcAsM-*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}