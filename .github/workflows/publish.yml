name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags like v0.2.3
    tags-ignore:
      - 'v*-test*'              # But explicitly ignore tags that end with -test
      
jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi # Corresponds to the environment name in PyPI's settings
    permissions:
      # This permission is required for trusted publishing
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build the package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --no-build
