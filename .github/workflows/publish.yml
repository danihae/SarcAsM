name: Publish to PyPI

on:
  push:
    tags: ['v*']

jobs:
  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv build
      - run: uv publish --no-build
